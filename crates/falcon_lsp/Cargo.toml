[package]
autotests         = false
name              = "falcon_lsp"
version.workspace = true
edition.workspace = true
description       = "LSP server implementation (JSON-RPC 2.0 / LSP 3.17) for falcon"

[features]
test-support = [  ]

[dependencies]
falcon_analyze       = { path = "../falcon_analyze" }
falcon_dart_parser   = { path = "../falcon_dart_parser" }
falcon_diagnostics   = { path = "../falcon_diagnostics" }
falcon_config        = { path = "../falcon_config" }
falcon_project       = { path = "../falcon_project" }
falcon_rules         = { path = "../falcon_rules" }
falcon_syntax        = { path = "../falcon_syntax" }
lsp-server.workspace = true
lsp-types.workspace  = true
serde_json.workspace = true
crossbeam-channel    = "0.5"
tracing.workspace    = true

[dev-dependencies]
falcon_analyze               = { path = "../falcon_analyze", features = [ "test-support" ] }
falcon_project               = { path = "../falcon_project", features = [ "test-support" ] }
tempfile.workspace           = true
serde.workspace              = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

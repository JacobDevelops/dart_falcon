[package]
name              = "falcon_rules"
version.workspace = true
edition.workspace = true
description       = "Lint rules for falcon, the Dart linter"

[dependencies]
falcon_syntax      = { path = "../falcon_syntax" }
falcon_dart_parser = { path = "../falcon_dart_parser" }
falcon_analyze     = { path = "../falcon_analyze" }
falcon_diagnostics = { path = "../falcon_diagnostics" }
falcon_config      = { path = "../falcon_config" }
glob               = { workspace = true }
regex              = { workspace = true }
regress            = { workspace = true }
serde_json         = { workspace = true }
serde_yaml         = { workspace = true }
marked-yaml        = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
walkdir   = { workspace = true }
tempfile  = { workspace = true }

[[bench]]
name    = "rules_bench"
harness = false

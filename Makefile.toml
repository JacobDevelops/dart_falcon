[config]
default_to_workspace = false
skip_core_tasks      = true

[env]
ROOT = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}"
# Under cargo-make, mbx has already removed its cargo shim from PATH, so a bare
# `cargo` would bypass the cache. Override with `CARGO_CMD=cargo makers ...`.
CARGO_CMD = { value = "mbx", condition = { env_not_set = [ "CARGO_CMD" ] } }

[tasks.build]
run_task = { name = [ "build_workspace", "zed_build" ], parallel = false }

[tasks.build_workspace]
private = true
command = "${CARGO_CMD}"
args    = [ "build", "--locked", "--workspace", "${@}" ]

[tasks.build_release]
run_task = { name = [ "build_release_workspace", "zed_build_release" ], parallel = false }

[tasks.build_release_workspace]
private = true
command = "${CARGO_CMD}"
args    = [ "build", "--locked", "--workspace", "--release", "${@}" ]

[tasks.check]
command = "${CARGO_CMD}"
args    = [ "check", "--locked", "--workspace", "--all-targets", "${@}" ]

[tasks.format]
run_task = { name = [ "format_workspace", "zed_format" ], parallel = false }

[tasks.format_workspace]
private = true
command = "${CARGO_CMD}"
args    = [ "fmt", "--all" ]

[tasks.format_check]
run_task = { name = [ "format_check_workspace", "zed_format_check" ], parallel = false }

[tasks.format_check_workspace]
private = true
command = "${CARGO_CMD}"
args    = [ "fmt", "--all", "--check" ]

[tasks.toml_format]
command = "taplo"
args    = [ "format" ]

[tasks.toml_check]
command = "taplo"
args    = [ "format", "--check" ]

[tasks.clippy]
run_task = { name = [ "clippy_workspace", "zed_clippy" ], parallel = false }

[tasks.clippy_workspace]
private = true
command = "${CARGO_CMD}"
args    = [ "clippy", "--locked", "--workspace", "--all-targets", "--", "-D", "warnings" ]

[tasks.lint]
run_task = { name = [ "format_check", "toml_check", "clippy" ], parallel = false }

[tasks.test]
run_task = { name = [ "test_targets", "test_doctests" ], parallel = false }

[tasks.test_targets]
private = true
command = "${CARGO_CMD}"
args    = [ "nextest", "run", "--locked", "--workspace", "--all-targets", "${@}" ]

[tasks.test_doctests]
private = true
command = "${CARGO_CMD}"
args    = [ "test", "--locked", "--workspace", "--doc" ]

[tasks.test_no_capture]
command = "${CARGO_CMD}"
args    = [ "nextest", "run", "--locked", "--workspace", "--all-targets", "--no-capture", "${@}" ]

[tasks.validate_rules]
command = "${CARGO_CMD}"
args    = [ "xtask", "validate-rules", "${@}" ]

# Single dev build with bench dev-deps unified; `build` then `bench_check` compiles every library twice.
# The zed build runs last: its mbx gc can evict the workspace target under CI's size budget.
[tasks.ci_validate]
script = '''
set -eu
target_dir="${CARGO_TARGET_DIR:-${ROOT}/target}"
"${CARGO_CMD}" build --locked --workspace --bins --bench '*'
"${target_dir}/debug/xtask" validate-rules --falcon-bin "${target_dir}/debug/falcon"
"${target_dir}/debug/xtask" docgen --check --falcon-bin "${target_dir}/debug/falcon"
"${CARGO_CMD}" build --locked --manifest-path extensions/falcon-zed/Cargo.toml --target wasm32-wasip2
'''

[tasks.docgen]
command = "${CARGO_CMD}"
args    = [ "xtask", "docgen" ]

[tasks.changeset]
command = "knope"
args    = [ "document-change" ]

[tasks.version]
command = "${CARGO_CMD}"
args    = [ "xtask", "version", "${@}" ]

[tasks.bench]
command = "${CARGO_CMD}"
args    = [ "bench", "--locked", "--workspace", "${@}" ]

[tasks.bench_compare]
command = "${CARGO_CMD}"
args    = [ "xtask", "bench-compare", "${@}" ]

[tasks.bench_check]
command = "${CARGO_CMD}"
args    = [ "build", "--locked", "--workspace", "--bench", "*" ]

[tasks.run]
command = "${CARGO_CMD}"
args    = [ "run", "--locked", "-p", "dart_falcon", "--", "${@}" ]

[tasks.run_release]
command = "${CARGO_CMD}"
args    = [ "run", "--locked", "--release", "-p", "dart_falcon", "--", "${@}" ]

[tasks.watch]
command = "${CARGO_CMD}"
args    = [ "watch", "-x", "check --workspace --all-targets" ]

# `mbx clean` only removes mbx-managed targets, not an explicit CARGO_TARGET_DIR.
[tasks.clean]
script = '''
if [ -n "${CARGO_TARGET_DIR:-}" ]; then cargo clean; else "${CARGO_CMD}" clean; fi
'''

[tasks.web_install]
cwd     = "website"
command = "bun"
args    = [ "install", "--frozen-lockfile" ]

[tasks.web_dev]
cwd     = "website"
command = "bun"
args    = [ "run", "dev" ]

[tasks.web_typecheck]
cwd     = "website"
command = "bunx"
args    = [ "tsc", "--noEmit" ]

[tasks.web_build]
cwd     = "website"
command = "bun"
args    = [ "run", "build" ]

[tasks.zed_build]
private = true
command = "${CARGO_CMD}"
args = [
  "build",
  "--locked",
  "--manifest-path",
  "extensions/falcon-zed/Cargo.toml",
  "--target",
  "wasm32-wasip2",
]

[tasks.zed_build_release]
private = true
command = "${CARGO_CMD}"
args = [
  "build",
  "--locked",
  "--manifest-path",
  "extensions/falcon-zed/Cargo.toml",
  "--target",
  "wasm32-wasip2",
  "--release",
]

[tasks.zed_format]
private = true
command = "${CARGO_CMD}"
args    = [ "fmt", "--manifest-path", "extensions/falcon-zed/Cargo.toml" ]

[tasks.zed_format_check]
private = true
command = "${CARGO_CMD}"
args    = [ "fmt", "--manifest-path", "extensions/falcon-zed/Cargo.toml", "--check" ]

[tasks.zed_clippy]
private = true
command = "${CARGO_CMD}"
args = [
  "clippy",
  "--locked",
  "--manifest-path",
  "extensions/falcon-zed/Cargo.toml",
  "--target",
  "wasm32-wasip2",
  "--all-targets",
  "--",
  "-D",
  "warnings",
]

[tasks.A]
run_task = { name = [ "lint", "check", "test", "validate_rules", "bench_check", "build_release" ], parallel = false }

[tasks.a]
run_task = { name = [ "build", "test", "validate_rules" ], parallel = false }

[tasks.ba]
run_task = { name = [ "build", "build_release" ], parallel = false }

[tasks.reset]
run_task = { name = [ "clean", "a" ], parallel = false }

[tasks.b]
alias = "build"

[tasks.br]
alias = "build_release"

[tasks.c]
alias = "check"

[tasks.cp]
alias = "clippy"

[tasks.cl]
alias = "clean"

[tasks.f]
alias = "format"

[tasks.L]
alias = "lint"

[tasks.r]
alias = "run"

[tasks.rr]
alias = "run_release"

[tasks.t]
alias = "test"

[tasks.tnc]
alias = "test_no_capture"

[tasks.v]
alias = "validate_rules"

[tasks.w]
alias = "watch"

[tasks.ci_rustup_show]
command = "rustup"
args    = [ "show" ]

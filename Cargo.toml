[workspace]
members  = [ ".", "crates/*", "xtask" ]
resolver = "2"

[workspace.package]
version    = "0.4.5"
edition    = "2024"
authors    = [ "Jacob Sanderson" ]
license    = "MIT"
homepage   = "https://dart-falcon.jacobdevelops.com"
repository = "https://github.com/JacobDevelops/dart_falcon"

[workspace.dependencies]
# Diagnostics & reporting
serde               = { version = "1", features = [ "derive" ] }
serde_json          = { version = "1", features = [ "preserve_order" ] }
serde_path_to_error = "0.1"
serde_yaml          = "0.9"
marked-yaml         = "0.8"
schemars            = "1.2"

# LSP
lsp-server = "0.7"
lsp-types  = "0.97"

# Parallel execution
rayon = "1"

# Binary allocator
tikv-jemallocator = "0.7.0"

# Fast hashing of internal index keys
rustc-hash = "2"

# CLI
clap     = { version = "4", features = [ "derive" ] }
glob     = "0.3"
walkdir  = "2"
tempfile = "3"

# String similarity
strsim = "0.10"

# Regex (format-comment rule: ignored_patterns option)
regex   = "1"
regress = "0.11"

# Tracing & observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter", "json" ] }

# Testing
insta     = "1"
criterion = { version = "0.5", features = [ "html_reports" ] }

[package]
name                 = "dart_falcon"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
homepage.workspace   = true
repository.workspace = true
description          = "A fast Dart linter built in Rust"
keywords             = [ "dart", "flutter", "linter", "lsp" ]
categories           = [ "command-line-utilities", "development-tools" ]

[package.metadata.binstall]
pkg-url             = "{ repo }/releases/download/v{ version }/falcon-{ version }-{ target-arch }-{ os-name }.tar.gz"
pkg-fmt             = "tgz"
bin-dir             = "{ bin }"
disabled-strategies = [ "quick-install", "compile" ]

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/falcon-{ version }-x86_64-darwin.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/falcon-{ version }-aarch64-darwin.tar.gz"

[dependencies]
falcon_cli = { path = "crates/falcon_cli" }

[target.'cfg(all(target_arch = "x86_64", target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator.workspace = true

[dev-dependencies]
criterion.workspace  = true
falcon_analyze       = { path = "crates/falcon_analyze" }
falcon_config        = { path = "crates/falcon_config" }
falcon_dart_parser   = { path = "crates/falcon_dart_parser" }
falcon_diagnostics   = { path = "crates/falcon_diagnostics" }
falcon_project       = { path = "crates/falcon_project" }
falcon_rules         = { path = "crates/falcon_rules" }
serde_json.workspace = true
tempfile.workspace   = true

[[bin]]
name = "falcon"
path = "src/main.rs"

[[bench]]
name    = "jfit_mobile_bench"
harness = false

# Debug symbols in bench builds so `cargo flamegraph --bench` resolves frames
# without slowing the optimized code (M6.1 profiling setup).
[profile.bench]
debug = true

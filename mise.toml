#:schema https://mise.jdx.dev/schema/mise.json

wrappers = { cargo = { command = "mbx", env = { MBX_CARGO_SHIM_MODE = "1" } } }

# Rust comes from rustup via rust-toolchain.toml; mise installs every other tool at latest.
[tools]
bun           = "latest"
mr-boxington  = "latest"
cargo-make    = "latest"
taplo         = "latest"
cargo-nextest = { version = "latest", version_prefix = "cargo-nextest-" }
cargo-watch   = "latest"
knope         = "latest"

[tool_alias]
cargo-nextest = "github:nextest-rs/nextest"
cargo-watch   = "github:watchexec/cargo-watch"
knope         = "github:knope-dev/knope"

#:schema https://mise.jdx.dev/schema/mise.json

# Rust comes from rustup via rust-toolchain.toml; mise installs every other tool at latest.
[tools]
bun                   = "latest"
cargo-make            = "latest"
taplo                 = "latest"
"cargo:cargo-nextest" = { version = "latest", locked = true }
"cargo:cargo-watch"   = { version = "latest", locked = true }

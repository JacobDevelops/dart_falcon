#:schema https://mise.jdx.dev/schema/mise.json

wrappers = { cargo = { command = "mbx", env = { MBX_CARGO_SHIM_MODE = "1" } } }

# Rust comes from rustup via rust-toolchain.toml; mise installs the other tools.
[tools]
bun           = "latest"
dart          = "latest"
mr-boxington  = "latest"
cargo-make    = "latest"
taplo         = "latest"
cargo-nextest = { version = "latest", version_prefix = "cargo-nextest-" }
cargo-watch   = "latest"
knope         = { version = "0.23.1", version_prefix = "knope/v" }
hyperfine     = "2.0.0"

[tool_alias]
cargo-nextest = "github:nextest-rs/nextest"
cargo-watch   = "github:watchexec/cargo-watch"
knope         = "github:knope-dev/knope"

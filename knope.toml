[package]
versioned_files = [ "Cargo.toml" ]
changelog       = "CHANGELOG.md"

[changes]
ignore_conventional_commits = true

[github]
owner = "JacobDevelops"
repo  = "dart_falcon"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type    = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type    = "Command"
command = "cargo xtask version $version"

[[workflows.steps]]
type    = "Command"
command = "git add --all"

[[workflows.steps]]
type    = "Command"
command = "git commit -m \"chore: prepare release $version\""

name: falcon
version: 0.4.5
description: A launcher for the falcon native Dart linter that downloads and verifies the matching GitHub release binary on first run.
homepage: https://dart-falcon.jacobdevelops.com
repository: https://github.com/JacobDevelops/dart_falcon
issue_tracker: https://github.com/JacobDevelops/dart_falcon/issues
environment:
  sdk: ^3.0.0
executables:
  falcon: falcon
platforms:
  linux:
  macos:
dependencies:
  crypto: ^3.0.3
dev_dependencies:
  frontend_server_client: ^4.0.0
  test: ^1.29.0

name: Release

# Merging the release PR or pushing a version tag builds and publishes the platform binaries.
on:
  push:
    tags: ["v*"]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release; omit to release the version at the selected ref"
        required: false
      commit:
        description: "Immutable draft-release commit for automated notarisation continuation"
        required: false

permissions:
  contents: read

jobs:
  resolve:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.head_ref == 'release' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.inputs.commit || (github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag)) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          INPUT_COMMIT: ${{ github.event.inputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_COMMIT" ]; then
            if [[ ! "$INPUT_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$INPUT_COMMIT" ] || ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
              echo "Continuation commit must be an immutable commit on $DEFAULT_BRANCH" >&2
              exit 1
            fi
          fi
          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "dart_falcon") | .version')"
          tag="v$version"
          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "$tag" ]; then
            echo "Tag $INPUT_TAG does not match workspace version $version" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$tag" && [ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "Tag $tag already exists at a different commit; refusing to retarget it" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check publishing credentials
        id: packaging
        env:
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID != '' }}
          HAS_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
          HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ "$HAS_APPLE_CERTIFICATE" = true ] || missing+=(APPLE_CERTIFICATE_P12)
          [ "$HAS_APPLE_CERTIFICATE_PASSWORD" = true ] || missing+=(APPLE_CERTIFICATE_PASSWORD)
          [ "$HAS_APPLE_API_ISSUER_ID" = true ] || missing+=(APPLE_API_ISSUER_ID)
          [ "$HAS_APPLE_API_KEY_ID" = true ] || missing+=(APPLE_API_KEY_ID)
          [ "$HAS_APPLE_API_KEY_P8" = true ] || missing+=(APPLE_API_KEY_P8)
          [ "$HAS_APPLE_TEAM_ID" = true ] || missing+=(APPLE_TEAM_ID)
          [ "$HAS_MINISIGN_KEY" = true ] || missing+=(MINISIGN_SECRET_KEY)
          [ "$HAS_TAP_TOKEN" = true ] || missing+=(HOMEBREW_TAP_TOKEN)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Release requires these secrets: ${missing[*]}" >&2
            exit 1
          fi

  build:
    needs: resolve
    name: Build ${{ matrix.platform }}
    # zig cross-links every target from Linux; falcon links no Apple frameworks, so macOS needs no SDK.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, platform: x86_64-linux }
          - { target: aarch64-unknown-linux-musl, platform: aarch64-linux }
          - { target: aarch64-apple-darwin, platform: aarch64-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild
      - name: Build
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked -p dart_falcon --target "${{ matrix.target }}"
          mkdir -p stage
          install -m755 "target/${{ matrix.target }}/release/falcon" stage/falcon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.platform }}
          path: stage/falcon
          if-no-files-found: error

  notarise:
    name: Notarise macOS binary
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    outputs:
      id: ${{ steps.notary.outputs.id }}
      name: ${{ steps.notary.outputs.name }}
      status: ${{ steps.notary.outputs.status }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-aarch64-darwin
          path: stage
      - name: Install pinned Apple signing tool
        run: |
          set -euo pipefail
          archive=apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
          curl --fail --silent --show-error --location "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/$archive" -o "$RUNNER_TEMP/$archive"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apple-codesign-0.29.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Sign and notarise macOS binary
        id: notary
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PLATFORM: aarch64-darwin
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ needs.resolve.outputs.ref }}
          INPUT_COMMIT: ${{ github.event.inputs.commit }}
        run: |
          set -euo pipefail
          umask 077
          certificate="$RUNNER_TEMP/signing.p12"
          password="$RUNNER_TEMP/signing-password"
          key="$RUNNER_TEMP/notary.p8"
          auth="$RUNNER_TEMP/notary-key.json"
          history="$RUNNER_TEMP/notary-history"
          result="$RUNNER_TEMP/notary-result"
          submission=""
          trap 'rm -f "$certificate" "$password" "$key" "$auth" "$history" "$result" "$submission"' EXIT
          chmod 755 stage/falcon
          stored="falcon-${RELEASE_TAG#v}-$PLATFORM.signed"
          archive="falcon-${RELEASE_TAG#v}-$PLATFORM.tar.gz"
          releases="$(gh api --paginate "repos/$GH_REPO/releases" --slurp)"
          release="$(jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first // empty' <<< "$releases")"
          if [ -n "$INPUT_COMMIT" ] && { [ -z "$release" ] || [ "$(jq -r .target_commitish <<< "$release")" != "$RELEASE_REF" ]; }; then
            echo "Continuation must match the recorded draft release commit for $RELEASE_TAG" >&2
            exit 1
          fi
          if [ -n "$release" ] && [ "$(jq -r .draft <<< "$release")" = true ] && [ "$(jq -r .target_commitish <<< "$release")" != "$RELEASE_REF" ]; then
            echo "Draft release $RELEASE_TAG targets $(jq -r .target_commitish <<< "$release"), not $RELEASE_REF; rerun the original ref" >&2
            exit 1
          fi
          if [ -n "$release" ] && { [ "$(jq -r .draft <<< "$release")" = false ] || jq -e --arg name "$archive" 'any(.assets[]; .name == $name)' <<< "$release" > /dev/null; }; then
            gh release download "$RELEASE_TAG" --pattern "$archive" --dir "$RUNNER_TEMP"
            tar -xzf "$RUNNER_TEMP/$archive" -C stage falcon
          elif [ -n "$release" ] && jq -e --arg name "$stored" 'any(.assets[]; .name == $name)' <<< "$release" > /dev/null; then
            gh release download "$RELEASE_TAG" --pattern "$stored" --dir "$RUNNER_TEMP"
            install -m755 "$RUNNER_TEMP/$stored" stage/falcon
          else
            printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$certificate"
            printf '%s\n' "$APPLE_CERTIFICATE_PASSWORD" > "$password"
            rcodesign sign --p12-file "$certificate" --p12-password-file "$password" \
              --binary-identifier falcon --team-name "$APPLE_TEAM_ID" --digest sha256 \
              --code-signature-flags runtime --for-notarization \
              --timestamp-url http://timestamp.apple.com/ts01 stage/falcon
            rcodesign verify stage/falcon
            if [ -z "$release" ]; then
              gh release create "$RELEASE_TAG" --draft --target "$RELEASE_REF" --title "$RELEASE_TAG" --notes ""
            fi
            cp stage/falcon "$RUNNER_TEMP/$stored"
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$stored"
          fi
          rcodesign verify stage/falcon
          cdhash="$(rcodesign extract code-directory-raw stage/falcon | sha256sum)"
          cdhash="${cdhash:0:40}"
          [[ "$cdhash" =~ ^[0-9a-f]{40}$ ]]
          name="falcon-${RELEASE_TAG#v}-$PLATFORM-$cdhash.zip"
          submission="$RUNNER_TEMP/$name"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          rcodesign encode-app-store-connect-api-key "$APPLE_API_ISSUER_ID" "$APPLE_API_KEY_ID" "$key" --output-path "$auth"
          rcodesign notary-list --api-key-file "$auth" > "$history"
          id=""
          status=""
          priority=3
          while read -r candidate date candidate_name type candidate_status; do
            [ "$candidate_name" = "$name" ] || continue
            case "$candidate_status" in
              accepted) candidate_status=Accepted ;;
              "in progress") candidate_status="In Progress" ;;
              invalid) candidate_status=Invalid ;;
              rejected) candidate_status=Rejected ;;
            esac
            case "$candidate_status" in
              Invalid|Rejected) candidate_priority=0 ;;
              Accepted) candidate_priority=1 ;;
              *) candidate_priority=2 ;;
            esac
            if [ "$candidate_priority" -lt "$priority" ]; then
              id="$candidate"
              status="$candidate_status"
              priority="$candidate_priority"
            fi
          done < "$history"
          if [ -z "$id" ]; then
            zip -j "$submission" stage/falcon
            rcodesign notary-submit --api-key-file "$auth" "$submission" 2>&1 | tee "$result"
            id="$(jq -Rr 'capture("created submission ID: (?<id>[0-9a-fA-F-]+)").id' "$result")"
            [[ "$id" =~ ^[0-9a-fA-F-]{36}$ ]]
            status="In Progress"
          fi
          printf 'id=%s\nname=%s\nstatus=%s\n' "$id" "$name" "$status" >> "$GITHUB_OUTPUT"
          printf 'Notarisation submission: `%s`\n\nName: `%s`\n\nStatus: **%s**\n' "$id" "$name" "$status" >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            Accepted|"In Progress") ;;
            Invalid|Rejected)
              rcodesign notary-log --api-key-file "$auth" "$id"
              echo "Notarisation submission $id has status $status" >&2
              exit 1
              ;;
            *) echo "Unknown notarisation status: $status" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-aarch64-darwin
          path: stage/falcon
          if-no-files-found: error

  await-notarisation:
    needs: [resolve, notarise]
    if: needs.notarise.outputs.status == 'In Progress'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/notarisation.yml
    with:
      release-ref: ${{ needs.resolve.outputs.ref }}
      release-tag: ${{ needs.resolve.outputs.tag }}
      submission-id: ${{ needs.notarise.outputs.id }}
      submission-name: ${{ needs.notarise.outputs.name }}
      attempt: "1"
      continue-in-caller: true
    secrets:
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

  package:
    name: Package ${{ matrix.platform }}
    needs: [resolve, build, notarise, await-notarisation]
    if: ${{ !cancelled() && needs.notarise.result == 'success' && (needs.notarise.outputs.status == 'Accepted' || needs.await-notarisation.outputs.status == 'Accepted') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { platform: x86_64-linux }
          - { platform: aarch64-linux }
          - { platform: aarch64-darwin }
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.platform == 'aarch64-darwin' && 'signed-aarch64-darwin' || format('binary-{0}', matrix.platform) }}
          path: stage
      - name: Package
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist
          chmod 755 stage/falcon
          COPYFILE_DISABLE=1 tar -C stage -czf "dist/falcon-${VERSION}-${{ matrix.platform }}.tar.gz" falcon
          # Versionless copy so `releases/latest/download/falcon-<platform>.tar.gz` always resolves.
          cp "dist/falcon-${VERSION}-${{ matrix.platform }}.tar.gz" "dist/falcon-${{ matrix.platform }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [resolve, package]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      - name: Read changelog release notes
        id: notes
        run: |
          set -euo pipefail
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="${RELEASE_TAG#v}" '/^## /{p = index($0, "## " v " (") == 1; next} p' CHANGELOG.md > release-notes.md
          fi
          echo "found=$(grep -q '[^[:space:]]' release-notes.md && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Write checksums
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - name: Install archive signing tool
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign archives and checksum manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          for asset in dist/*.tar.gz dist/SHA256SUMS; do
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$asset"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Check release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --slurp)"
          draft="$(jq -er --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | first | .draft | tostring' <<< "$releases")"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        id: github-release
        with:
          draft: ${{ steps.state.outputs.draft == 'true' }}
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.ref }}
          body_path: release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          # Re-releasing an old tag must not steal `latest` from the newest release.
          make_latest: legacy
          files: dist/*
          fail_on_unmatched_files: true
      - name: Publish accepted release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.github-release.outputs.id }}
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          target="$(awk 'NR == 1 { direct = $1 } /\^\{\}$/ { peeled = $1 } END { print peeled ? peeled : direct }' <<< "$remote")"
          if [ -n "$target" ] && [ "$target" != "$(git rev-parse HEAD)" ]; then
            echo "Refusing to publish $RELEASE_TAG: its remote tag targets $target, not this release commit" >&2
            exit 1
          fi
          assets="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --slurp)"
          while IFS= read -r id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done < <(jq -r '.[][] | select(.name | endswith(".signed")) | .id' <<< "$assets")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=legacy
      # pub.dev only accepts tokens from tag-scoped runs, and this run may come from the release PR merge.
      - name: Dispatch package publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "$RELEASE_TAG"

  homebrew:
    name: Publish Homebrew formula
    needs: [resolve, release]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP || 'JacobDevelops/homebrew-tap' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - name: Check latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            *-*|*+*) echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "publish=$([ "$latest" = "$RELEASE_TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Download release checksums
        if: steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir dist
      - name: Generate formula
        if: steps.latest.outputs.publish == 'true'
        run: cargo xtask homebrew --version "${RELEASE_TAG#v}" --checksums dist/SHA256SUMS --output falcon.rb
      - name: Publish formula to tap
        if: steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          path="repos/$HOMEBREW_TAP/contents/Formula/falcon.rb"
          if gh api "$path" > tap-current.json 2> tap-error.log; then
            sha="$(jq -er .sha tap-current.json)"
          elif jq -e '.status == "404"' tap-current.json > /dev/null; then
            sha=""
          else
            cat tap-error.log >&2
            exit 1
          fi
          jq -n --arg message "chore: release falcon $RELEASE_TAG" \
            --arg content "$(base64 -w0 falcon.rb)" --arg sha "$sha" \
            '{message: $message, content: $content} + (if $sha == "" then {} else {sha: $sha} end)' > tap-update.json
          gh api --method PUT "$path" --input tap-update.json

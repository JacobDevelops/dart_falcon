name: Release

# Tag a version (vX.Y.Z) → build the four platform binaries → publish a GitHub
# Release with the tarballs. workflow_dispatch takes an existing tag for manual re-runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    # zig cross-links every target from Linux; falcon links no Apple frameworks, so macOS needs no SDK.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, platform: x86_64-linux }
          - { target: aarch64-unknown-linux-musl, platform: aarch64-linux }
          - { target: x86_64-apple-darwin, platform: x86_64-darwin }
          - { target: aarch64-apple-darwin, platform: aarch64-darwin }
    env:
      INPUT_TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild
      - name: Build and package
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-$GITHUB_REF_NAME}"; VERSION="${VERSION#v}"
          cargo zigbuild --release --locked -p dart_falcon --target "${{ matrix.target }}"
          mkdir -p stage dist
          install -m755 "target/${{ matrix.target }}/release/falcon" stage/falcon
          tar -C stage -czf "dist/falcon-${VERSION}-${{ matrix.platform }}.tar.gz" falcon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      INPUT_TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      # Fail fast if the release tag and Cargo.toml version disagree.
      - name: Verify tag matches Cargo.toml
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-$GITHUB_REF_NAME}"; VERSION="${VERSION#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "tag v$VERSION does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true

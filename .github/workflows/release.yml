name: Release

# Tag a version (vX.Y.Z) → build the four platform binaries → publish a GitHub
# Release with the tarballs. workflow_dispatch takes an existing tag for manual re-runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

jobs:
  build-linux:
    name: Build Linux (static musl)
    runs-on: ubuntu-latest
    env:
      INPUT_TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      # zig is the cross-linker: aarch64 musl links cleanly on the x86_64 runner.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build and package
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-$GITHUB_REF_NAME}"; VERSION="${VERSION#v}"
          archive_platform() {
            case "$1" in
              x86_64-unknown-linux-musl) echo x86_64-linux ;;
              aarch64-unknown-linux-musl) echo aarch64-linux ;;
            esac
          }
          mkdir -p dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --release --locked -p dart_falcon --target "$target"
            rm -rf stage && mkdir -p stage
            install -m755 "target/$target/release/falcon" stage/falcon
            tar -C stage -czf "dist/falcon-${VERSION}-$(archive_platform "$target").tar.gz" falcon
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  build-darwin:
    name: Build macOS
    runs-on: macos-latest
    env:
      INPUT_TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build and package
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-$GITHUB_REF_NAME}"; VERSION="${VERSION#v}"
          archive_platform() {
            case "$1" in
              aarch64-apple-darwin) echo aarch64-darwin ;;
              x86_64-apple-darwin) echo x86_64-darwin ;;
            esac
          }
          mkdir -p dist
          # Apple's native toolchain cross-builds the intel target on arm runners.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p dart_falcon --target "$target"
            rm -rf stage && mkdir -p stage
            install -m755 "target/$target/release/falcon" stage/falcon
            tar -C stage -czf "dist/falcon-${VERSION}-$(archive_platform "$target").tar.gz" falcon
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs-darwin
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      INPUT_TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tarballs-*
          merge-multiple: true
          path: dist
      # Fail fast if the release tag and Cargo.toml version disagree.
      - name: Verify tag matches Cargo.toml
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-$GITHUB_REF_NAME}"; VERSION="${VERSION#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "tag v$VERSION does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true

name: Release

# Merging the release PR or pushing a version tag builds and publishes the platform binaries.
on:
  push:
    tags: ["v*"]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

jobs:
  resolve:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.head_ref == 'release' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || (github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag)) || github.ref }}
      - name: Resolve release version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          TAG="$INPUT_TAG"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then TAG="v$VERSION"; fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: Build ${{ matrix.platform }}
    # zig cross-links every target from Linux; falcon links no Apple frameworks, so macOS needs no SDK.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, platform: x86_64-linux }
          - { target: aarch64-unknown-linux-musl, platform: aarch64-linux }
          - { target: x86_64-apple-darwin, platform: x86_64-darwin }
          - { target: aarch64-apple-darwin, platform: aarch64-darwin }
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild
      - name: Build and package
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          cargo zigbuild --release --locked -p dart_falcon --target "${{ matrix.target }}"
          mkdir -p stage dist
          install -m755 "target/${{ matrix.target }}/release/falcon" stage/falcon
          tar -C stage -czf "dist/falcon-${VERSION}-${{ matrix.platform }}.tar.gz" falcon
          # Versionless copy so `releases/latest/download/falcon-<platform>.tar.gz` always resolves.
          cp "dist/falcon-${VERSION}-${{ matrix.platform }}.tar.gz" "dist/falcon-${{ matrix.platform }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      - name: Read changelog release notes
        id: notes
        run: |
          set -euo pipefail
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="${RELEASE_TAG#v}" '/^## /{p = index($0, "## " v " (") == 1; next} p' CHANGELOG.md > release-notes.md
          fi
          echo "found=$(grep -q '[^[:space:]]' release-notes.md && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Write checksums
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.ref }}
          body_path: release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          # Re-releasing an old tag must not steal `latest` from the newest release.
          make_latest: legacy
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
      # pub.dev only accepts tokens from tag-scoped runs, and this run may come from the release PR merge.
      - name: Dispatch package publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "$RELEASE_TAG"

name: Release

# Merging the release PR or pushing a version tag builds and publishes the platform binaries.
on:
  push:
    tags: ["v*"]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  resolve:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.head_ref == 'release' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || (github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag)) || github.ref }}
          persist-credentials: false
      - name: Resolve release version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "dart_falcon") | .version')"
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$INPUT_TAG" != "$tag" ]; then
            echo "Tag $INPUT_TAG does not match workspace version $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check publishing credentials
        id: packaging
        env:
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD != '' }}
          HAS_MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
          HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ "$HAS_APPLE_CERTIFICATE" = true ] || missing+=(APPLE_CERTIFICATE_P12)
          [ "$HAS_APPLE_CERTIFICATE_PASSWORD" = true ] || missing+=(APPLE_CERTIFICATE_PASSWORD)
          [ "$HAS_APPLE_ID" = true ] || missing+=(APPLE_ID)
          [ "$HAS_APPLE_TEAM_ID" = true ] || missing+=(APPLE_TEAM_ID)
          [ "$HAS_APPLE_APP_PASSWORD" = true ] || missing+=(APPLE_APP_PASSWORD)
          [ "$HAS_MINISIGN_KEY" = true ] || missing+=(MINISIGN_SECRET_KEY)
          [ "$HAS_TAP_TOKEN" = true ] || missing+=(HOMEBREW_TAP_TOKEN)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Release requires these secrets: ${missing[*]}" >&2
            exit 1
          fi

  build:
    needs: resolve
    name: Build ${{ matrix.platform }}
    # zig cross-links every target from Linux; falcon links no Apple frameworks, so macOS needs no SDK.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, platform: x86_64-linux }
          - { target: aarch64-unknown-linux-musl, platform: aarch64-linux }
          - { target: x86_64-apple-darwin, platform: x86_64-darwin }
          - { target: aarch64-apple-darwin, platform: aarch64-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild
      - name: Build
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked -p dart_falcon --target "${{ matrix.target }}"
          mkdir -p stage
          install -m755 "target/${{ matrix.target }}/release/falcon" stage/falcon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.platform }}
          path: stage/falcon
          if-no-files-found: error

  package:
    name: Package ${{ matrix.platform }}
    needs: [resolve, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { platform: x86_64-linux, runner: ubuntu-latest }
          - { platform: aarch64-linux, runner: ubuntu-latest }
          - { platform: x86_64-darwin, runner: macos-latest }
          - { platform: aarch64-darwin, runner: macos-latest }
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ matrix.platform }}
          path: stage
      - name: Restore executable permission
        run: chmod 755 stage/falcon
      - name: Sign and notarise macOS binary
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/signing.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          submission="$RUNNER_TEMP/notarization.zip"
          result="$RUNNER_TEMP/notarization.json"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || :; rm -f "$certificate" "$submission" "$result"' EXIT
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$certificate"
          password="$(openssl rand -base64 32)"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          identity=""
          while IFS= read -r line; do
            case "$line" in
              *'"Developer ID Application:'*)
                identity="${line#*\"}"
                identity="${identity%%\"*}"
                break
                ;;
            esac
          done < <(security find-identity -v -p codesigning "$keychain")
          if [ -z "$identity" ]; then
            echo "Certificate must include a Developer ID Application signing identity and private key" >&2
            exit 1
          fi
          codesign --force --options runtime --timestamp --sign "$identity" --keychain "$keychain" stage/falcon
          codesign --verify --strict --verbose stage/falcon
          ditto -c -k --keepParent stage/falcon "$submission"
          xcrun notarytool submit "$submission" --wait --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --output-format json > "$result" || { cat "$result"; exit 1; }
          cat "$result"
          jq -e '.status == "Accepted"' "$result" > /dev/null
      - name: Package
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -C stage -czf "dist/falcon-${VERSION}-${{ matrix.platform }}.tar.gz" falcon
          # Versionless copy so `releases/latest/download/falcon-<platform>.tar.gz` always resolves.
          cp "dist/falcon-${VERSION}-${{ matrix.platform }}.tar.gz" "dist/falcon-${{ matrix.platform }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [resolve, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      - name: Read changelog release notes
        id: notes
        run: |
          set -euo pipefail
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="${RELEASE_TAG#v}" '/^## /{p = index($0, "## " v " (") == 1; next} p' CHANGELOG.md > release-notes.md
          fi
          echo "found=$(grep -q '[^[:space:]]' release-notes.md && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Write checksums
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS
      - name: Install archive signing tool
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign archives and checksum manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          for asset in dist/*.tar.gz dist/SHA256SUMS; do
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$asset"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.ref }}
          body_path: release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          # Re-releasing an old tag must not steal `latest` from the newest release.
          make_latest: legacy
          files: dist/*
          fail_on_unmatched_files: true
      # pub.dev only accepts tokens from tag-scoped runs, and this run may come from the release PR merge.
      - name: Dispatch package publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "$RELEASE_TAG"

  homebrew:
    name: Publish Homebrew formula
    needs: [resolve, release]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP || 'JacobDevelops/homebrew-tap' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - name: Check latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            *-*|*+*) echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "publish=$([ "$latest" = "$RELEASE_TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Download release checksums
        if: steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir dist
      - name: Generate formula
        if: steps.latest.outputs.publish == 'true'
        run: cargo xtask homebrew --version "${RELEASE_TAG#v}" --checksums dist/SHA256SUMS --output falcon.rb
      - name: Publish formula to tap
        if: steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          path="repos/$HOMEBREW_TAP/contents/Formula/falcon.rb"
          if gh api "$path" > tap-current.json 2> tap-error.log; then
            sha="$(jq -er .sha tap-current.json)"
          elif jq -e '.status == "404"' tap-current.json > /dev/null; then
            sha=""
          else
            cat tap-error.log >&2
            exit 1
          fi
          jq -n --arg message "chore: release falcon $RELEASE_TAG" \
            --arg content "$(base64 -w0 falcon.rb)" --arg sha "$sha" \
            '{message: $message, content: $content} + (if $sha == "" then {} else {sha: $sha} end)' > tap-update.json
          gh api --method PUT "$path" --input tap-update.json

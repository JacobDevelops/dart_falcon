name: Release

# Tag a version (vX.Y.Z) → build the four platform binaries → publish a GitHub
# Release with the tarballs. workflow_dispatch takes an existing tag for manual re-runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true

jobs:
  build-linux:
    name: Build Linux (static musl)
    runs-on: ubuntu-latest
    env:
      INPUT_TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      # zig is the cross-linker: aarch64 musl links cleanly on the x86_64 runner.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild
      - name: Build and package
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-$GITHUB_REF_NAME}"; VERSION="${VERSION#v}"
          archive_platform() {
            case "$1" in
              x86_64-unknown-linux-musl) echo x86_64-linux ;;
              aarch64-unknown-linux-musl) echo aarch64-linux ;;
            esac
          }
          mkdir -p dist
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --release --locked -p dart_falcon --target "$target"
            rm -rf stage && mkdir -p stage
            install -m755 "target/$target/release/falcon" stage/falcon
            tar -C stage -czf "dist/falcon-${VERSION}-$(archive_platform "$target").tar.gz" falcon
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  build-darwin:
    name: Build macOS
    runs-on: macos-latest
    env:
      INPUT_TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build and package
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-$GITHUB_REF_NAME}"; VERSION="${VERSION#v}"
          archive_platform() {
            case "$1" in
              aarch64-apple-darwin) echo aarch64-darwin ;;
              x86_64-apple-darwin) echo x86_64-darwin ;;
            esac
          }
          mkdir -p dist
          # Apple's native toolchain cross-builds the intel target on arm runners.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p dart_falcon --target "$target"
            rm -rf stage && mkdir -p stage
            install -m755 "target/$target/release/falcon" stage/falcon
            tar -C stage -czf "dist/falcon-${VERSION}-$(archive_platform "$target").tar.gz" falcon
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs-darwin
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      INPUT_TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tarballs-*
          merge-multiple: true
          path: dist
      # Fail fast if the release tag and Cargo.toml version disagree.
      - name: Verify tag matches Cargo.toml
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-$GITHUB_REF_NAME}"; VERSION="${VERSION#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "tag v$VERSION does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true

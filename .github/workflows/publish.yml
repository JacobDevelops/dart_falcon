name: Publish

# Dispatched by release.yml at the release tag; package registries publish from here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pub:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/falcon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require matching version tag
        working-directory: .
        run: test "$GITHUB_REF_TYPE" = tag && test "$GITHUB_REF_NAME" = "v$(awk '/^version:/{print $2; exit}' packages/falcon/pubspec.yaml)"
      - name: Check published version
        id: published
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://pub.dev/api/packages/falcon/versions/$version")"
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "pub.dev version lookup returned HTTP $status" >&2; exit 1 ;;
          esac
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: steps.published.outputs.exists == 'false'
      - run: dart pub get
        if: steps.published.outputs.exists == 'false'
      - run: dart pub publish --force
        if: steps.published.outputs.exists == 'false'

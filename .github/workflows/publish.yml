name: Publish

# Dispatched by release.yml at the release tag; package registries and the website publish from here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pub:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/falcon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require matching version tag
        working-directory: .
        run: test "$GITHUB_REF_TYPE" = tag && test "$GITHUB_REF_NAME" = "v$(awk '/^version:/{print $2; exit}' packages/falcon/pubspec.yaml)"
      - name: Check published version
        id: published
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://pub.dev/api/packages/falcon/versions/$version")"
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "pub.dev version lookup returned HTTP $status" >&2; exit 1 ;;
          esac
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: steps.published.outputs.exists == 'false'
      - run: dart pub get
        if: steps.published.outputs.exists == 'false'
      - run: dart pub publish --force
        if: steps.published.outputs.exists == 'false'

  website:
    name: Deploy website
    runs-on: ubuntu-latest
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Re-releasing an old tag or a prerelease must not roll the site back.
      - name: Check latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          case "$GITHUB_REF_NAME" in
            *-*|*+*) echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "deploy=$([ "$latest" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        if: steps.latest.outputs.deploy == 'true'
        with:
          install_args: bun
          cache: true
      - run: bun install --frozen-lockfile
        if: steps.latest.outputs.deploy == 'true'
      - run: bun run deploy
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

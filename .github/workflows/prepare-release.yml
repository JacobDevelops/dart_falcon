name: Prepare release

on:
  push:
    branches: [main]

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changesets:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: echo "present=${{ hashFiles('.changeset/*.md') != '' }}" >> "$GITHUB_OUTPUT"

  prepare-release:
    needs: changesets
    if: needs.changesets.outputs.present == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # Restore-only: the lint snapshot is the closest prebuilt match for building xtask.
      - uses: ./.github/actions/mbx-setup
        with:
          tools: cargo-make mr-boxington knope
          snapshot: lint
      - run: makers ci_rustup_show
      - run: knope prepare-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (fmt, taplo, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: aqua:sagiegurari/cargo-make aqua:tamasfe/taplo
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: makers ci_rustup_show
      - run: makers lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: aqua:sagiegurari/cargo-make cargo-nextest
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: makers test

  validate:
    name: Validate rules, bench compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: aqua:sagiegurari/cargo-make
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: makers validate_rules
      - run: makers bench_check

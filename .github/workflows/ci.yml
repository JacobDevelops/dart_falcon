name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Debuginfo is most of the codegen, link and cache size; panics still report file:line without it.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"

# Each job restores the newest mbx compiler snapshot that main saved for it; only
# main pushes write snapshots, so pull requests never seed what main restores.
# MBX_GC_MAX_TOTAL_SIZE bounds each snapshot as main keeps adding to it.
jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - snapshot: lint
            name: Lint (fmt, taplo, clippy)
            tools: cargo-make taplo mr-boxington
            gc: 2GiB
            run: makers ci_rustup_show && makers lint
          - snapshot: test
            name: Test
            tools: cargo-make cargo-nextest mr-boxington
            gc: 6GiB
            run: makers test
          - snapshot: validate
            name: Validate rules, bench compile
            tools: cargo-make mr-boxington
            gc: 3GiB
            run: makers ci_validate
    env:
      MBX_GC_MAX_TOTAL_SIZE: ${{ matrix.gc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/mbx-setup
        with:
          tools: ${{ matrix.tools }}
          snapshot: ${{ matrix.snapshot }}
      - run: ${{ matrix.run }}
      # Automatic gc runs at most hourly, so enforce MBX_GC_MAX_TOTAL_SIZE before saving.
      - name: Trim compiler snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        run: mbx gc
      - name: Save main compiler snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mbx
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.setup.outputs.key }}

  dart:
    name: Dart launcher
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/falcon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

name: OSS corpus

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-corpus-nightly
  cancel-in-progress: false

jobs:
  e2e:
    name: Full pinned corpus
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/mbx-setup
        with:
          tools: mr-boxington
          snapshot: e2e
      - id: clones
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/e2e
          key: oss-corpus-full-${{ hashFiles('xtask/e2e-corpus.json') }}
      - run: cargo xtask e2e
        env:
          CARGO_CMD: mbx
          MBX_TARGET_KEEP: ${{ github.workspace }}

      - name: Save corpus checkouts
        if: always() && steps.clones.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/e2e
          key: oss-corpus-full-${{ hashFiles('xtask/e2e-corpus.json') }}
      - name: Trim compiler snapshot
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        run: mbx gc
      - name: Save main compiler snapshot
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/mbx
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.setup.outputs.key }}